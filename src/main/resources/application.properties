spring.application.name=prompt
server.port=8181
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
spring.ai.openai.api-key=${OPENAI_API_KEY}
logging.level.org.springframework.ai.chat.client=DEBUG
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.max-tokens=2000

spring.datasource.url=jdbc:h2:file:C:\\Users\\PrasadJoshi\\chatmemory;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=prasad
spring.datasource.password=12345

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


app.datasource.postgres.url=jdbc:postgresql://localhost:5432/vectordb
app.datasource.postgres.username=postgres
app.datasource.postgres.password=${POSTGRES_PASSWORD:postgres123}
app.datasource.postgres.driver-class-name=org.postgresql.Driver

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=example
spring.ai.vectorstore.pgvector.table-name=vectors
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.docker.compose.stop.command=down
spring.docker.compose.enabled=false
